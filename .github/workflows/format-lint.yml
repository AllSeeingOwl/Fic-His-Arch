name: Automated Formatting & Lint Auto-Fix

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  format-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Run Prettier
        run: pnpm run format

      - name: Run ESLint (Auto-fix)
        run: pnpm run lint --fix
        continue-on-error: true

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: Apply automated formatting & lint auto-fixes"
