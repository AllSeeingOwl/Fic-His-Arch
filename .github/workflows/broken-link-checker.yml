name: Broken Link Checker

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Broken Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude-path node_modules --exclude 'https?://.*\.fandom\.com/.*' --exclude 'https?://.*\.evageeks\.org/.*' --exclude 'https?://.*combineoverwiki\.net/.*' --exclude 'https?://.*theinfosphere\.org/.*' --exclude 'https?://.*gineipaedia\.com/.*' './**/*.md' './**/*.html'
          fail: true
