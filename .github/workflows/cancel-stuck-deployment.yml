name: Cancel Stuck Pages Deployment

on:
  workflow_dispatch:
    inputs:
      deployment_hash:
        description: "The deployment hash to cancel (e.g., ae885d58859726a223e031b7507af1b13d0fdef7)"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

jobs:
  cancel-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel GitHub Pages Deployment
        run: |
          echo "Attempting to cancel deployment hash: ${{ inputs.deployment_hash }}"
          curl -f -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages/deployments/${{ inputs.deployment_hash }}/cancel
          echo "Cancellation request sent."
